<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade & Percentage Calculator</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }
        .container {
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 5px 0;
        }
        button {
            width: 96%;
            padding: 10px;
            background: rgb(69, 69, 226);
            color: white;
            border: none;
            cursor: pointer;
        }
        h3 {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>Grade Calculator</h3>

    <input type="number" id="sub1" placeholder="Subject 1">
    <input type="number" id="sub2" placeholder="Subject 2">
    <input type="number" id="sub3" placeholder="Subject 3">
    <input type="number" id="sub4" placeholder="Subject 4">
    <input type="number" id="sub5" placeholder="Subject 5">

    <button onclick="calculate()">Calculate</button>

    <p id="result"></p>
</div>

<script>
function calculate() {
    let s1 = Number(document.getElementById("sub1").value);
    let s2 = Number(document.getElementById("sub2").value);
    let s3 = Number(document.getElementById("sub3").value);
    let s4 = Number(document.getElementById("sub4").value);
    let s5 = Number(document.getElementById("sub5").value);

    let total = s1 + s2 + s3 + s4 + s5;
    let percent = (total / 500) * 100;
    let grade;

    if (percent >= 90) grade = "A+";
    else if (percent >= 80) grade = "A";
    else if (percent >= 70) grade = "B";
    else if (percent >= 60) grade = "C";
    else if (percent >= 50) grade = "D";
    else grade = "Fail";

    document.getElementById("result").innerHTML =
        "Total Marks: " + total +
        "<br>Percentage: " + percent.toFixed(2) + "%" +
        "<br>Grade: " + grade;
}
</script>

</body>
</html>

</body>
</html>
